<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Failure Detection — Monitoring Dashboard</title>
<style>
/* ── tokens ──────────────────────────────────────────────────────────────── */
:root {
  color-scheme: light;
  --surface-0:  #f4f4f1;
  --surface-1:  #fcfcfb;
  --surface-2:  #efeeea;
  --border:     #dedcd5;
  --border-str: #c6c3b9;
  --text-1:     #0b0b0b;
  --text-2:     #52514e;
  --text-3:     #85837c;
  --accent:     #2a78d6;

  --c-success:  #1baf7a;
  --c-halluc:   #eb6834;
  --c-loop:     #2a78d6;
  --c-unsafe:   #e34948;

  /* sequential blue, low → high. Each step carries its own ink colour so the
     ramp can be re-stepped for dark mode without the label logic changing. */
  --seq-1: #cde2fb; --seq-2: #9ec5f4; --seq-3: #6da7ec;
  --seq-4: #3987e5; --seq-5: #256abf; --seq-6: #184f95; --seq-7: #0d366b;
  --ink-1: #0b0b0b; --ink-2: #0b0b0b; --ink-3: #0b0b0b;
  --ink-4: #ffffff; --ink-5: #ffffff; --ink-6: #ffffff; --ink-7: #ffffff;

  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
  --r: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --surface-0:  #121211;
    --surface-1:  #1a1a19;
    --surface-2:  #242422;
    --border:     #33332f;
    --border-str: #4a4a45;
    --text-1:     #ffffff;
    --text-2:     #c3c2b7;
    --text-3:     #8d8b81;
    --accent:     #3987e5;
    --c-success:  #199e70;
    --c-halluc:   #d95926;
    --c-loop:     #3987e5;
    --c-unsafe:   #e66767;
    /* dark: the ramp is re-stepped so low values sit near the surface and
       high values read brightest — not an automatic flip of the light ramp. */
    --seq-1: #16283d; --seq-2: #1c3d66; --seq-3: #22548c;
    --seq-4: #2a6cb3; --seq-5: #3987e5; --seq-6: #6da7ec; --seq-7: #9ec5f4;
    --ink-1: #ffffff; --ink-2: #ffffff; --ink-3: #ffffff;
    --ink-4: #ffffff; --ink-5: #ffffff; --ink-6: #0b0b0b; --ink-7: #0b0b0b;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface-0:  #121211; --surface-1: #1a1a19; --surface-2: #242422;
  --border: #33332f; --border-str: #4a4a45;
  --text-1: #ffffff; --text-2: #c3c2b7; --text-3: #8d8b81; --accent: #3987e5;
  --c-success: #199e70; --c-halluc: #d95926; --c-loop: #3987e5; --c-unsafe: #e66767;
  /* dark: the ramp is re-stepped so low values sit near the surface and
     high values read brightest — not an automatic flip of the light ramp. */
  --seq-1: #16283d; --seq-2: #1c3d66; --seq-3: #22548c;
  --seq-4: #2a6cb3; --seq-5: #3987e5; --seq-6: #6da7ec; --seq-7: #9ec5f4;
  --ink-1: #ffffff; --ink-2: #ffffff; --ink-3: #ffffff;
  --ink-4: #ffffff; --ink-5: #ffffff; --ink-6: #0b0b0b; --ink-7: #0b0b0b;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--surface-0); color: var(--text-1);
  font-family: var(--sans); font-size: 14px; line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

/* ── shell ───────────────────────────────────────────────────────────────── */
.shell { max-width: 1240px; margin: 0 auto; padding: 0 28px 72px; }

header.top {
  border-bottom: 1px solid var(--border);
  background: var(--surface-1);
  position: sticky; top: 0; z-index: 20;
}
.top-inner {
  max-width: 1240px; margin: 0 auto; padding: 18px 28px 0;
  display: flex; flex-direction: column; gap: 14px;
}
.brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.brand h1 { font-size: 17px; font-weight: 650; margin: 0; letter-spacing: -0.01em; }
.brand .sub { font-size: 13px; color: var(--text-3); }
.brand .spacer { flex: 1; }
.themebtn {
  background: none; border: 1px solid var(--border); color: var(--text-2);
  border-radius: 6px; padding: 4px 10px; font: inherit; font-size: 12px;
  cursor: pointer;
}
.themebtn:hover { border-color: var(--border-str); color: var(--text-1); }

nav.tabs { display: flex; gap: 2px; }
nav.tabs button {
  background: none; border: none; border-bottom: 2px solid transparent;
  color: var(--text-3); font: inherit; font-size: 13.5px; font-weight: 500;
  padding: 9px 16px; cursor: pointer; margin-bottom: -1px;
}
nav.tabs button:hover { color: var(--text-1); }
nav.tabs button[aria-selected="true"] {
  color: var(--text-1); border-bottom-color: var(--accent); font-weight: 600;
}

/* ── blocks ──────────────────────────────────────────────────────────────── */
section.block { margin-top: 34px; }
.block > h2 {
  font-size: 12px; font-weight: 650; text-transform: uppercase;
  letter-spacing: 0.07em; color: var(--text-3); margin: 0 0 4px;
}
.block > .lede { color: var(--text-2); margin: 0 0 16px; max-width: 74ch; }

.card {
  background: var(--surface-1); border: 1px solid var(--border);
  border-radius: var(--r); padding: 20px;
}
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(2, minmax(0,1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0,1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0,1fr)); }
@media (max-width: 900px) { .g2,.g3,.g4 { grid-template-columns: 1fr; } }

/* ── stat tiles ──────────────────────────────────────────────────────────── */
.tile { background: var(--surface-1); border: 1px solid var(--border);
        border-radius: var(--r); padding: 16px 18px; }
.tile .k { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em;
           color: var(--text-3); font-weight: 600; }
.tile .v { font-size: 30px; font-weight: 640; letter-spacing: -0.02em;
           margin-top: 4px; font-variant-numeric: tabular-nums; }
.tile .n { font-size: 12.5px; color: var(--text-3); margin-top: 2px; }

/* ── tables ──────────────────────────────────────────────────────────────── */
table.data { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
table.data th {
  text-align: right; font-size: 11.5px; text-transform: uppercase;
  letter-spacing: .05em; color: var(--text-3); font-weight: 600;
  padding: 0 0 8px; border-bottom: 1px solid var(--border);
}
table.data th:first-child, table.data td:first-child { text-align: left; }
table.data td { padding: 9px 0; text-align: right; border-bottom: 1px solid var(--border); }
table.data tr:last-child td { border-bottom: none; }
table.data td.best { font-weight: 650; }
table.data tr.total td { border-top: 1px solid var(--border-str); font-weight: 650; }

/* ── misc ────────────────────────────────────────────────────────────────── */
.swatch { width: 9px; height: 9px; border-radius: 2px; display: inline-block;
          margin-right: 7px; vertical-align: 1px; flex: none; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 14px;
          font-size: 12.5px; color: var(--text-2); }
.mono { font-family: var(--mono); font-size: 12.5px; }
.pill { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: .03em;
        padding: 2px 8px; border-radius: 100px; border: 1px solid var(--border-str);
        color: var(--text-2); background: var(--surface-2); }
.note { font-size: 12.5px; color: var(--text-3); margin-top: 12px; }

/* ── replay ──────────────────────────────────────────────────────────────── */
.replay-grid { display: grid; grid-template-columns: minmax(0,1.15fr) minmax(0,1fr); gap: 16px; }
@media (max-width: 1000px) { .replay-grid { grid-template-columns: 1fr; } }
select.sel {
  font: inherit; font-size: 13px; color: var(--text-1); background: var(--surface-1);
  border: 1px solid var(--border-str); border-radius: 6px; padding: 7px 10px; min-width: 260px;
}
.controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
.btn {
  font: inherit; font-size: 13px; font-weight: 500; padding: 7px 13px;
  border: 1px solid var(--border-str); background: var(--surface-1);
  color: var(--text-1); border-radius: 6px; cursor: pointer;
}
.btn:hover:not(:disabled) { background: var(--surface-2); }
.btn:disabled { opacity: .4; cursor: default; }
.btn.pri { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.pri:hover:not(:disabled) { filter: brightness(1.08); }

.stepper { display: flex; gap: 4px; margin: 14px 0 0; flex-wrap: wrap; }
.stepper button {
  font: inherit; font-size: 12px; font-variant-numeric: tabular-nums;
  width: 30px; height: 30px; border-radius: 6px; cursor: pointer;
  border: 1px solid var(--border); background: var(--surface-1); color: var(--text-2);
  position: relative;
}
.stepper button[aria-current="true"] {
  border-color: var(--accent); background: var(--accent); color: #fff; font-weight: 650;
}
.stepper button.detected::after {
  content: ""; position: absolute; inset: -3px; border-radius: 8px;
  border: 1.5px dashed var(--c-unsafe);
}
.trace-step { border: 1px solid var(--border); border-radius: var(--r);
              padding: 14px 16px; background: var(--surface-1); margin-bottom: 10px; }
.trace-step.dim { opacity: .42; }
.trace-step.cur { border-color: var(--border-str); box-shadow: 0 0 0 2px color-mix(in oklab, var(--accent) 22%, transparent); }
.trace-step .lbl { font-size: 10.5px; font-weight: 700; letter-spacing: .08em;
                   text-transform: uppercase; color: var(--text-3); margin-bottom: 3px; }
.trace-step .body { font-family: var(--mono); font-size: 12.5px; line-height: 1.5;
                    white-space: pre-wrap; word-break: break-word; color: var(--text-1); }
.trace-step .row + .row { margin-top: 10px; }
.trace-step .obs { color: var(--text-2); }
.scrollbox { max-height: 560px; overflow-y: auto; padding-right: 6px; }

.banner {
  border-radius: var(--r); padding: 11px 14px; font-size: 13px;
  border: 1px solid var(--border-str); background: var(--surface-2); color: var(--text-2);
}
.banner strong { color: var(--text-1); }
.banner.hit { border-color: var(--c-unsafe);
              background: color-mix(in oklab, var(--c-unsafe) 12%, var(--surface-1)); }

.probrow { display: grid; grid-template-columns: 128px 1fr 52px; align-items: center;
           gap: 10px; margin-bottom: 7px; }
.probrow .nm { font-size: 12px; color: var(--text-2); display: flex; align-items: center;
               white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.probrow .track { height: 15px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.probrow .fill { height: 100%; border-radius: 4px; transition: width .28s ease; }
.probrow .val { font-family: var(--mono); font-size: 12px; text-align: right;
                font-variant-numeric: tabular-nums; color: var(--text-1); }
.probrow.top .nm, .probrow.top .val { color: var(--text-1); font-weight: 650; }

.tax { border: 1px solid var(--border); border-radius: var(--r); padding: 16px 18px;
       background: var(--surface-1); border-top: 3px solid var(--bar, var(--accent)); }
.tax h3 { margin: 0 0 6px; font-size: 13.5px; font-weight: 650; letter-spacing: .01em; }
.tax p { margin: 0; font-size: 13px; color: var(--text-2); }
.tax .cnt { font-size: 12px; color: var(--text-3); margin-top: 9px;
            font-variant-numeric: tabular-nums; }

footer.foot { margin-top: 48px; padding-top: 18px; border-top: 1px solid var(--border);
              font-size: 12.5px; color: var(--text-3); display: flex; gap: 18px; flex-wrap: wrap; }
</style>
</head>
<body>
<div id="root"></div>

<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>
<script src="dashboard_data.js"></script>
<script src="app.js"></script>
</body>
</html>
